x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: worship-production

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    logging: *service-logging
    image: ${IMAGE_PREFIX:-worship-production}/backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  frontend:
    image: ${IMAGE_PREFIX:-worship-production}/frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  push-worker:
    logging: *service-logging
    image: ${IMAGE_PREFIX:-worship-production}/backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    command: ["python", "-m", "worship_bot.push_worker"]
    depends_on:
      api:
        condition: service_healthy

  bot:
    logging: *service-logging
    image: ${IMAGE_PREFIX:-worship-production}/bot:${IMAGE_TAG:-main}
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      BACKEND_URL: http://api:8000/api/v1
      OFFSET_FILE: /data/offset.txt
      WEB_URL: ${WEB_URL:-http://localhost:8080}
    volumes:
      - bot_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  bot_data:
