[project]
name = "worship-bot-backend"
version = "0.1.0"
description = "Backend for worship team scheduling and song management"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.30,<1.0",
	"sqlalchemy[asyncio]>=2.0,<3.0",
	"asyncpg>=0.29,<1.0",
	"alembic>=1.13,<2.0",
	"pydantic-settings>=2.5,<3.0",
	"python-dateutil>=2.9,<3.0",
	"tzdata>=2024.1",
	"PyJWT>=2.9,<3.0",
	"httpx>=0.27,<1.0",
	"python-multipart>=0.0.20,<1.0",
	"openpyxl>=3.1,<4.0",
	"pywebpush (>=2.0,<3.0)",
]

[tool.poetry]
packages = [{ include = "worship_bot" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.24,<1.0"
PyHamcrest = ">=2.1,<3.0"
ruff = ">=0.6,<1.0"
httpx = ">=0.27,<1.0"
aiosqlite = ">=0.20,<1.0"
mypy = ">=1.11,<2.0"
types-python-dateutil = ">=2.9,<3.0"
types-openpyxl = ">=3.1,<4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["worship_bot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["worship_bot", "tests", "migrations", "../bot_service"]
mypy_path = [".."]
strict = true
show_error_codes = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
[[tool.mypy.overrides]]
module = ["pywebpush"]
ignore_missing_imports = true
