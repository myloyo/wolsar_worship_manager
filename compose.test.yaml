services:
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TEST_DATABASE_NAME:?Set TEST_DATABASE_NAME in .env}
      POSTGRES_USER: ${TEST_DATABASE_USERNAME:?Set TEST_DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:?Set TEST_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-runner:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      DATABASE_HOST: test-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${TEST_DATABASE_NAME}
      DATABASE_USERNAME: ${TEST_DATABASE_USERNAME}
      DATABASE_PASSWORD: ${TEST_DATABASE_PASSWORD}
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "export TEST_DATABASE_URL=$$(python -c 'from worship_bot.config import get_settings; print(get_settings().database_url)'); poetry run alembic upgrade head && poetry run pytest -q"]
