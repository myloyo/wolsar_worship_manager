x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    logging: *service-logging
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  push-worker:
    logging: *service-logging
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    command: ["python", "-m", "worship_bot.push_worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bot:
    logging: *service-logging
    build:
      context: .
      dockerfile: bot_service/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      BACKEND_URL: http://api:8000/api/v1
      OFFSET_FILE: /data/offset.txt
      WEB_URL: ${WEB_URL:-http://localhost:8080}
    volumes:
      - bot_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped


volumes:
  postgres_data:
  bot_data:
